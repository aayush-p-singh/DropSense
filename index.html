<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DropSense</title>

<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<header>
  <div class="logo">Drop<em>Sense</em></div>
  <nav>
    <button class="active" onclick="showTab('prediction',this)">Prediction</button>
    <button onclick="showTab('advisory',this)">AI Advisory</button>
    <button onclick="showTab('community',this)">Community</button>
  </nav>
</header>

<main>

<!-- ================= PREDICTION ================= -->
<div class="section active" id="prediction">

  <h2>Prediction Engine</h2>

  <div id="prediction-app">

    <h1>💧 DropSense Dashboard</h1>

    <div class="dashboard">
      <div class="card">
        <h3>📊 Current Usage</h3>
        <h1 id="usage">100 <span>L</span></h1>
      </div>

      <div class="card">
        <h3>📈 Average Usage</h3>
        <h1 id="average">100 <span>L</span></h1>
      </div>

      <div class="card">
        <h3>⚡ Status</h3>
        <h2 id="alert" class="normal">Normal ✅</h2>
      </div>
    </div>

    <div class="progress-container">
      <p>Daily Usage Limit</p>
      <div class="progress-bar">
        <div id="progress"></div>
      </div>
    </div>

    <div class="controls">
      <button onclick="predictNext()">� Predict Next Usage</button>
      <button onclick="addUsage()">💧 Simulate Usage</button>

      <div class="input-group">
        <input type="number" id="manualInput" placeholder="Enter usage (L)">
        <button onclick="addManual()">➕ Add Manual</button>
      </div>
    </div>

    <canvas id="myChart"></canvas>

  </div>
</div>

<!-- ================= ADVISORY ================= -->
<div class="section" id="advisory">
  <h2>🤖 AI Advisory</h2>

  <div class="card">
    <h3>📋 Usage Summary</h3>
    <div id="adv-summary">No data yet</div>
  </div>

  <div class="card">
    <h3>🏆 Conservation Score</h3>
    <div id="adv-score">—</div>
  </div>

  <div class="card">
    <h3>💬 Ask the AI Assistant</h3>
    <div id="chat-msgs"></div>

    <div style="display:flex; gap:10px;">
      <input id="chat-input" placeholder="Ask about water conservation..." onkeydown="if(event.key==='Enter')sendChat()">
      <button onclick="sendChat()">📤 Send</button>
    </div>
  </div>
</div>

<!-- ================= COMMUNITY ================= -->
<div class="section" id="community">
  <h2>🌍 Community Reports</h2>

  <div class="card">
    <h3>📝 Submit a Report</h3>
    <input id="r-name" placeholder="Your Name">
    <input id="r-area" placeholder="Area/Location">
    <textarea id="r-desc" placeholder="Describe water issues or conservation tips..."></textarea>
    <button onclick="submitReport()">🚀 Submit Report</button>
  </div>

  <div class="card">
    <h3>📢 Community Feed</h3>
    <div id="c-feed"></div>
  </div>
</div>

</main>

<script src="script.js"></script>

</body>
</html>
